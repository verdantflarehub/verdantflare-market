name: Publish Helm Charts

on:
  workflow_dispatch:
    inputs:
      charts:
        description: "Space-separated chart names to publish (leave empty for all 14 Station charts)"
        required: false
        default: ""
  push:
    branches: [release]
    paths:
      - "charts/**"
      - "scripts/publish-charts.sh"
      - ".github/workflows/publish-charts.yml"

permissions:
  contents: read

concurrency:
  group: market-publish-charts-release
  cancel-in-progress: false

env:
  REGISTRY_HOST: registry.verdantflare.ai

jobs:
  publish:
    name: Package, push and verify OCI Helm Charts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Select requested or changed charts
        id: targets
        env:
          REQUESTED_CHARTS: ${{ inputs.charts }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "charts=$REQUESTED_CHARTS" >> "$GITHUB_OUTPUT"
          else
            # Removed charts stay immutable in the registry; only publish charts that still exist.
            charts=$(git diff --name-only "$BEFORE_SHA" HEAD -- charts/ | awk -F/ 'NF >= 3 {print $2}' | sort -u | while read -r chart; do if [[ -d "charts/$chart" ]]; then printf '%s ' "$chart"; fi; done)
            echo "charts=$charts" >> "$GITHUB_OUTPUT"
            if [[ -z "$charts" ]]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Publish and verify target Station charts
        if: steps.targets.outputs.skip != 'true'
        env:
          CHARTS: ${{ steps.targets.outputs.charts }}
          REGISTRY_PUBLISH_USERNAME: ${{ secrets.REGISTRY_PUBLISH_USERNAME }}
          REGISTRY_PUBLISH_PASSWORD: ${{ secrets.REGISTRY_PUBLISH_PASSWORD }}
          DIST_DIR: dist/charts
          SUMMARY_FILE: dist/charts/published-charts.json
        shell: bash
        run: bash scripts/publish-charts.sh

      - name: Upload published chart digests summary
        if: steps.targets.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: published-charts-summary
          path: dist/charts/published-charts.json
          if-no-files-found: error
          retention-days: 30
