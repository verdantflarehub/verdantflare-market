name: Huobao H3 trial integration

on:
  push:
    branches: [release]
    paths:
      - .github/workflows/huobao-h3-trial.yml
      - packaging/trial-workbenches/huobao-h3.patch

permissions:
  contents: read

concurrency:
  group: huobao-h3-trial-release
  cancel-in-progress: false

jobs:
  image:
    name: Build ${{ matrix.app }} internal trial image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: huobao-drama
            repository: chatfire-AI/huobao-drama
            source_commit: 26de7df59806588e98e103a21bd0bfd26d4a55a6
            image_version: huobao-drama-trial-v0.1.1
            build_args: HUOBAO_VERSION=4.0.8
    steps:
      - name: Checkout controlled integration patch
        uses: actions/checkout@v4
        with:
          path: integration
          persist-credentials: false
      - name: Checkout pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.source_commit }}
          persist-credentials: false
          path: upstream
      - name: Apply versioned integration patch
        working-directory: upstream
        run: git apply ../integration/packaging/trial-workbenches/huobao-h3.patch
      - uses: docker/setup-buildx-action@v3
      - name: Configure release destination
        id: registry
        env:
          REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT_ALIYUN }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${REGISTRY_ENDPOINT%/}"
          [[ "$endpoint" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?$ ]] || { echo 'Invalid or missing registry endpoint'; exit 1; }
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
          echo "image=$endpoint/wod/verdantflare-app" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.endpoint }}
          username: ${{ secrets.REGISTRY_USER_ALIYUN }}
          password: ${{ secrets.REGISTRY_PASSWORD_ALIYUN }}
      - name: Refuse an existing image tag
        env:
          IMAGE: ${{ steps.registry.outputs.image }}:${{ matrix.image_version }}
        shell: bash
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing image version'
            exit 1
          fi
      - name: Build and push pinned internal trial image
        uses: docker/build-push-action@v6
        with:
          context: upstream
          push: true
          platforms: linux/amd64
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.registry.outputs.image }}:${{ matrix.image_version }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
          provenance: false
          sbom: false
