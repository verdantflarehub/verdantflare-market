apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blender-mcp.appName" . }}-studio-only
  labels:
    {{- include "blender-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: blender
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.stationNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.studioPodName | quote }}
      ports:
        - {port: 8080, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blender-mcp.workerName" . }}-internal-only
  labels:
    {{- include "blender-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: blender-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: blender
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - {port: 48084, protocol: TCP}
        - {port: 48085, protocol: TCP}
        - {port: 48083, protocol: TCP}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.stationNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.studioPodName | quote }}
      ports:
        - {port: 48083, protocol: TCP}
