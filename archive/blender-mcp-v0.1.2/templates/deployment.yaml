{{- include "blender-mcp.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blender-mcp.appName" . }}
  labels:
    {{- include "blender-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: blender
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blender
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.images.app.repository }}:{{ .Values.images.app.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: BLENDER_INSTANCES_FILE
              value: /config/instances.json
            - name: BLENDER_DATABASE
              value: /state/blender.db
            - name: BLENDER_CONTENT_ORIGIN
              value: {{ .Values.contentOrigin | quote }}
            - name: BLENDER_CONTENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.contentSecretName | quote }}
                  key: {{ .Values.auth.contentTokenKey | quote }}
            - name: BLENDER_STUDIO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName | quote }}
                  key: {{ .Values.auth.studioTokenKey | quote }}
            - name: BLENDER_WORKER_A
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName | quote }}
                  key: {{ .Values.auth.workerTokenKey | quote }}
            - name: BLENDER_GUI_A_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName | quote }}
                  key: {{ .Values.auth.guiPasswordKey | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.appPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources.app | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: state
              mountPath: /state
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: {{ .Values.instance.configMapName | quote }}
            items:
              - key: {{ .Values.instance.configKey | quote }}
                path: instances.json
        - name: state
          persistentVolumeClaim:
            claimName: {{ .Values.storage.app.existingClaim | default (printf "%s-state" (include "blender-mcp.appName" .)) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blender-mcp.workerName" . }}
  labels:
    {{- include "blender-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: blender-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blender-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: blender
          image: "{{ .Values.images.worker.repository }}:{{ .Values.images.worker.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: true
            privileged: false
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: INSTANCE_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.instance.configMapName | quote }}
                  key: {{ .Values.instance.idKey | quote }}
            - name: WORKSPACE_ROOT
              value: /workspace
            - name: BLENDER_FILE_AGENT_HOST
              value: 0.0.0.0
            - name: BLENDER_MCP_SECRET_FILE
              value: /secrets/BLENDER_WORKER_A
            - name: BLENDER_MCP_TOKEN_FILE
              value: /run/user/1000/blender-mcp-token
            - name: BDWIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName | quote }}
                  key: {{ .Values.auth.guiPasswordKey | quote }}
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility,graphics,video,display
            - name: DISPLAY_SIZEW
              value: "1600"
            - name: DISPLAY_SIZEH
              value: "900"
            - name: DISPLAY_REFRESH
              value: "30"
          ports:
            - {name: control, containerPort: 48084, protocol: TCP}
            - {name: gui, containerPort: 48083, protocol: TCP}
            - {name: files, containerPort: 48085, protocol: TCP}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /workspace, subPath: workspace}
            - {name: data, mountPath: /home/beagle, subPath: home}
            - {name: runtime, mountPath: /run/user/1000}
            - {name: shm, mountPath: /dev/shm}
            - {name: auth, mountPath: /secrets, readOnly: true}
          startupProbe:
            httpGet: {path: /readyz, port: control}
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: control}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: control}
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.storage.worker.existingClaim | default (include "blender-mcp.workerName" .) }}
        - name: runtime
          emptyDir:
            medium: Memory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: auth
          secret:
            secretName: {{ .Values.auth.secretName | quote }}
            items:
              - key: {{ .Values.auth.workerTokenKey | quote }}
                path: BLENDER_WORKER_A
