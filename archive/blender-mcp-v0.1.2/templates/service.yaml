apiVersion: v1
kind: Service
metadata:
  name: {{ include "blender-mcp.appName" . }}
  labels:
    {{- include "blender-mcp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: blender
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: http, port: 8080, targetPort: http, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "blender-mcp.workerName" . }}
  labels:
    {{- include "blender-mcp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: blender-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: control, port: 48084, targetPort: control, protocol: TCP}
    - {name: gui, port: 48083, targetPort: gui, protocol: TCP}
    - {name: files, port: 48085, targetPort: files, protocol: TCP}
