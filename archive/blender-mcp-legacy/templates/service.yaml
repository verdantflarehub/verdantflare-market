apiVersion: v1
kind: Service
metadata:
  name: {{ include "blender-mcp.name" . }}-app
  labels:
    {{- include "blender-mcp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: app
      port: {{ .Values.service.appPort }}
      targetPort: app
      protocol: TCP
  selector:
    {{- include "blender-mcp.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "blender-mcp.name" . }}-mcp
  labels:
    {{- include "blender-mcp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: mcp
      port: {{ .Values.service.mcpPort }}
      targetPort: mcp
      protocol: TCP
  selector:
    {{- include "blender-mcp.selectorLabels" . | nindent 4 }}
