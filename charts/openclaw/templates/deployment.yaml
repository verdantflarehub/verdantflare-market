{{- include "candidate.reviewGuard" . -}}
{{- if .Values.install.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "candidate.name" . }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
          ports:
            - name: app
              containerPort: 18789
          env:
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingName }}
                  key: OPENCLAW_GATEWAY_TOKEN
            - name: HOME
              value: /home/node
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /home/node/.openclaw
          readinessProbe:
            httpGet:
              path: /readyz
              port: app
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: app
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "candidate.name" . }}
{{- end }}
