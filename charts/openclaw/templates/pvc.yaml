{{- if .Values.install.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "candidate.name" . }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storage.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
{{- end }}
