apiVersion: v1
kind: Service
metadata:
  name: grok-channel
  namespace: {{ .Release.Namespace }}
  annotations:
    station.verdantflare.com/app-id: {{ .Values.appId | default .Chart.Name | quote }}
spec:
  ports:
  - name: management
    port: 8000
    protocol: TCP
    targetPort: management
  - name: execution
    port: 8001
    protocol: TCP
    targetPort: execution
  selector:
    app.kubernetes.io/name: grok-channel
  type: ClusterIP
