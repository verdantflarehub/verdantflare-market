apiVersion: v1
kind: Service
metadata:
  name: grok-channel
  namespace: verdantflare-grok
spec:
  ports:
  - name: management
    port: 8000
    protocol: TCP
    targetPort: management
  - name: execution
    port: 8001
    protocol: TCP
    targetPort: execution
  selector:
    app.kubernetes.io/name: grok-channel
  type: ClusterIP
