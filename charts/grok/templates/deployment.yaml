apiVersion: apps/v1
kind: Deployment
metadata:
  name: grok-channel
  namespace: verdantflare-grok
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: grok-channel
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grok-channel
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: GROK_STATE_DB
          value: /data/grok/state.sqlite3
        - name: GROK_NETWORK_URL
          value: http://app-network.verdantflare-station.svc.cluster.local:8080
        - name: GROK_NETWORK_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: network-channel-grok-access
        envFrom:
        - secretRef:
            name: grok-channel-auth
        - configMapRef:
            name: grok-channel-origins-v0-1-0
        image: registry.cn-qingdao.aliyuncs.com/wod/verdantflare-app:grok-channel-v0.1.10
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: management
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 1
        name: gateway
        ports:
        - containerPort: 8000
          name: management
          protocol: TCP
        - containerPort: 8001
          name: execution
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: management
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data/grok
          name: state
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: verdentflare-5090
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      terminationGracePeriodSeconds: 30
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: grok-channel
      - emptyDir: {}
        name: tmp
