apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-fal-gateway
  namespace: {{ .Release.Namespace }}
  annotations:
    station.verdantflare.com/app-id: {{ .Values.appId | default .Chart.Name | quote }}
spec:
  progressDeadlineSeconds: 600
  replicas: {{ .Values.replicas | default 1 }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: video-fal-gateway
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-fal-gateway
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: FAL_STATE_DB
          value: {{ .Values.storage.stateDbPath | default "/data/fal/state.sqlite3" | quote }}
        - name: HTTPS_PROXY
          value: http://openclash.openclash.svc.cluster.local:1081
        - name: NO_PROXY
          value: .svc.cluster.local,localhost,127.0.0.1
        - name: FAL_NETWORK_URL
          value: {{ .Values.network.url | default (printf "http://app-network.%s.svc.cluster.local:8080" .Release.Namespace) | quote }}
        - name: FAL_NETWORK_TOKEN
          valueFrom:
            secretKeyRef:
              key: {{ .Values.network.tokenKey | default "token" }}
              name: {{ .Values.network.existingSecretName | default "network-channel-fal-access" }}
        - name: FAL_LEGACY_PROXY_REFERENCE
          value: '{"mode":"proxy","proxy_id":"01a1262d-6404-7974-8699-f5cadbe9ee4e","revision":4}'
        envFrom:
        - secretRef:
            name: video-fal-gateway-auth
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: management
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 1
        name: gateway
        ports:
        - containerPort: 8000
          name: management
          protocol: TCP
        - containerPort: 8001
          name: execution
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: management
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: {{ .Values.storage.mountPath | default "/data/fal" }}
          name: state
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: verdentflare-5090
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      terminationGracePeriodSeconds: 30
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: {{ .Values.storage.existingClaim | default "video-fal-gateway" }}
      - emptyDir: {}
        name: tmp
