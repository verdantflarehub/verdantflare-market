apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-fal-gateway
  namespace: verdantflare-video
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: video-fal-gateway
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-fal-gateway
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: FAL_STATE_DB
          value: /data/fal/state.sqlite3
        - name: HTTPS_PROXY
          value: http://openclash.openclash.svc.cluster.local:1081
        - name: NO_PROXY
          value: .svc.cluster.local,localhost,127.0.0.1
        - name: FAL_NETWORK_URL
          value: http://app-network.verdantflare-station.svc.cluster.local:8080
        - name: FAL_NETWORK_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: network-channel-fal-access
        - name: FAL_LEGACY_PROXY_REFERENCE
          value: '{"mode":"proxy","proxy_id":"01a1262d-6404-7974-8699-f5cadbe9ee4e","revision":4}'
        envFrom:
        - secretRef:
            name: video-fal-gateway-auth
        image: registry.cn-qingdao.aliyuncs.com/wod/verdantflare-app:video-fal-gateway-v0.2.12
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: management
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 1
        name: gateway
        ports:
        - containerPort: 8000
          name: management
          protocol: TCP
        - containerPort: 8001
          name: execution
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: management
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data/fal
          name: state
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: verdentflare-5090
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      terminationGracePeriodSeconds: 30
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: video-fal-gateway
      - emptyDir: {}
        name: tmp
