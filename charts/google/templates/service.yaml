apiVersion: v1
kind: Service
metadata:
  name: {{ include "google.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "google.labels" . | nindent 4 }}
  annotations:
    station.verdantflare.com/app-id: {{ .Chart.Name | quote }}
spec:
  type: ClusterIP
  selector:
    {{- include "google.selectorLabels" . | nindent 4 }}
  ports:
    - name: management
      port: {{ .Values.service.managementPort }}
      targetPort: management
      protocol: TCP
    - name: execution
      port: {{ .Values.service.executionPort }}
      targetPort: execution
      protocol: TCP

