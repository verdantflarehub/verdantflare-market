apiVersion: v1
kind: Service
metadata:
  name: {{ include "google.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "google.labels" . | nindent 4 }}
  annotations:
    station.verdantflare.com/app-id: {{ .Chart.Name | quote }}
    {{- if .Values.station }}
    {{- if .Values.station.stationId }}
    station.verdantflare.com/station-id: {{ .Values.station.stationId | quote }}
    {{- end }}
    {{- if .Values.station.organizationId }}
    station.verdantflare.com/organization-id: {{ .Values.station.organizationId | quote }}
    {{- end }}
    {{- if .Values.station.installationId }}
    station.verdantflare.com/installation-id: {{ .Values.station.installationId | quote }}
    {{- end }}
    {{- if .Values.station.templateHash }}
    station.verdantflare.com/template-hash: {{ .Values.station.templateHash | quote }}
    {{- end }}
    {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "google.selectorLabels" . | nindent 4 }}
  ports:
    - name: management
      port: {{ .Values.service.managementPort }}
      targetPort: management
      protocol: TCP
    - name: execution
      port: {{ .Values.service.executionPort }}
      targetPort: execution
      protocol: TCP
    {{- if .Values.analysis.tls.enabled }}
    - name: analysis-tls
      port: 8002
      targetPort: analysis-tls
      protocol: TCP
    {{- end }}

