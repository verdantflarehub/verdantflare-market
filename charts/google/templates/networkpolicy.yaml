{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "google.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "google.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "google.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: verdantflare-station
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: verdantflare-image
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: verdantflare-video
      ports:
        - protocol: TCP
          port: {{ .Values.service.managementPort }}
        - protocol: TCP
          port: {{ .Values.service.executionPort }}
{{- end }}
