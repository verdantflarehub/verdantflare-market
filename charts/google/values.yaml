fullnameOverride: google-channel
namespace: verdantflare-app

image:
  repository: registry.cn-qingdao.aliyuncs.com/wod/verdantflare-app
  tag: google-channel-v0.1.27
  digest: ""
  pullPolicy: Always

replicaCount: 1

auth:
  existingSecretName: google-channel-auth

analysis:
  enabled: false
  existingSecretName: google-analysis-access
  tokenKey: token
  tls:
    enabled: false
    existingSecretName: ""
    worldNamespace: verdantflare-app
    worldPodName: app-world

network:
  url: http://app-network.verdantflare-app.svc.cluster.local:8080
  proxyUrl: http://app-network-egress.verdantflare-app.svc.cluster.local:3128
  existingSecretName: network-channel-google-access
  tokenKey: token

storage:
  create: false
  existingClaim: google-channel
  storageClassName: local-nvme
  volumeName: ""
  size: 2Gi
  mountPath: /data/google
  stateDbPath: /data/google/state.sqlite3

persistence:
  create: false
  storageClassName: local-nvme
  volumeName: ""
  size: 2Gi

service:
  managementPort: 8000
  executionPort: 8001

networkPolicy:
  enabled: true
  stationNamespace: verdantflare-station
  studioPodName: verdantflare-studio
  runtimePodName: station-runtime
  etcdPodName: etcd
  networkNamespace: verdantflare-app
  networkPodName: app-network
  imageNamespace: verdantflare-app
  imagePodName: image-mcp-server
  openclashNamespace: openclash
  openclashAppLabel: openclash
  openclashPorts:
    - 1081
    - 1082

resources: {}

nodeSelector: {}
tolerations: []

