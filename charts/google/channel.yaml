schema_version: 1
channel_id: google
channel_name: Google
channel_logo: logo.svg
capabilities:
  - capability_id: image.generate.nano_banana_2_1
    type: image
    model_id: gemini-nano-banana-2.1
    display_name: Nano Banana 2.1
    model_logo: nano-banana.png
    model_logo_mime: image/png
    operation: image.generate
    execution_state: enabled
    card_group: nano-banana-2-1
    card_title: Nano Banana 2.1
    input_summary: 提示词
    output_summary: PNG 图像 · $0.0336/张
    parameter_schema: &image_generate_parameters
      type: object
      additionalProperties: false
      required:
        - prompt
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 32000
        aspect_ratio:
          type: string
          enum:
            - "1:1"
            - "2:3"
            - "3:2"
            - "3:4"
            - "4:3"
            - "9:16"
            - "16:9"
        images:
          type: array
          maxItems: 0
  - capability_id: image.edit.nano_banana_2_1
    type: image
    model_id: gemini-nano-banana-2.1
    display_name: Nano Banana 2.1
    model_logo: nano-banana.png
    model_logo_mime: image/png
    operation: image.edit
    execution_state: enabled
    card_group: nano-banana-2-1
    card_title: Nano Banana 2.1
    input_summary: 提示词 · 1–6 张参考图（0 张蒙版）
    output_summary: PNG 图像 · $0.0336/张
    parameter_schema: &image_edit_parameters
      type: object
      additionalProperties: false
      required:
        - prompt
        - images
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 32000
        aspect_ratio:
          type: string
          enum:
            - "1:1"
            - "2:3"
            - "3:2"
            - "3:4"
            - "4:3"
            - "9:16"
            - "16:9"
        images:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required:
              - mime_type
              - data
            properties:
              mime_type:
                type: string
                enum:
                  - image/png
                  - image/jpeg
                  - image/webp
              data:
                type: string
                minLength: 1

  - capability_id: image.generate.nano_banana_pro
    type: image
    model_id: gemini-3-pro-image
    display_name: Nano Banana Pro
    model_logo: nano-banana.png
    model_logo_mime: image/png
    operation: image.generate
    execution_state: enabled
    card_group: nano-banana-pro
    card_title: Nano Banana Pro
    input_summary: 提示词
    output_summary: PNG 图像 · $0.134/张
    parameter_schema: *image_generate_parameters
  - capability_id: image.edit.nano_banana_pro
    type: image
    model_id: gemini-3-pro-image
    display_name: Nano Banana Pro
    model_logo: nano-banana.png
    model_logo_mime: image/png
    operation: image.edit
    execution_state: enabled
    card_group: nano-banana-pro
    card_title: Nano Banana Pro
    input_summary: 提示词 · 1–6 张参考图（0 张蒙版）
    output_summary: PNG 图像 · $0.134/张
    parameter_schema: *image_edit_parameters

  - capability_id: image.generate.nano_banana_2
    type: image
    model_id: gemini-3.1-flash-image
    display_name: Nano Banana 2
    model_logo: nano-banana.png
    model_logo_mime: image/png
    operation: image.generate
    execution_state: enabled
    card_group: nano-banana-2
    card_title: Nano Banana 2
    input_summary: 提示词
    output_summary: PNG 图像 · $0.0672/张
    parameter_schema: *image_generate_parameters
  - capability_id: image.edit.nano_banana_2
    type: image
    model_id: gemini-3.1-flash-image
    display_name: Nano Banana 2
    model_logo: nano-banana.png
    model_logo_mime: image/png
    operation: image.edit
    execution_state: enabled
    card_group: nano-banana-2
    card_title: Nano Banana 2
    input_summary: 提示词 · 1–6 张参考图（0 张蒙版）
    output_summary: PNG 图像 · $0.0672/张
    parameter_schema: *image_edit_parameters

  - capability_id: image.generate.nano_banana_2_lite
    type: image
    model_id: gemini-3.1-flash-lite-image
    display_name: Nano Banana 2 Lite
    model_logo: nano-banana.png
    model_logo_mime: image/png
    operation: image.generate
    execution_state: enabled
    card_group: nano-banana-2-lite
    card_title: Nano Banana 2 Lite
    input_summary: 提示词
    output_summary: PNG 图像 · $0.0336/张
    parameter_schema: *image_generate_parameters
  - capability_id: image.edit.nano_banana_2_lite
    type: image
    model_id: gemini-3.1-flash-lite-image
    display_name: Nano Banana 2 Lite
    model_logo: nano-banana.png
    model_logo_mime: image/png
    operation: image.edit
    execution_state: enabled
    card_group: nano-banana-2-lite
    card_title: Nano Banana 2 Lite
    input_summary: 提示词 · 1–6 张参考图（0 张蒙版）
    output_summary: PNG 图像 · $0.0336/张
    parameter_schema: *image_edit_parameters

  - capability_id: analysis.analyze
    type: analysis
    model_id: gemini-3.1-pro-preview
    operation: analysis.analyze
    execution_state: adapter_connected_unverified
    parameter_schema: &analysis_parameters
      type: object
      additionalProperties: false
      required: [prompt]
      anyOf:
        - required: [source_text]
        - required: [media]
      properties:
        prompt: {type: string, minLength: 1, maxLength: 64000}
        source_text: {type: string, minLength: 1, maxLength: 256000}
        video_fps: {type: number, minimum: 0.1, maximum: 8, default: 2}
        video_range:
          type: object
          additionalProperties: false
          required: [start_ms, end_ms]
          properties:
            start_ms: {type: integer, minimum: 0, maximum: 86399999}
            end_ms: {type: integer, minimum: 1, maximum: 86400000}
          description: Original video timeline in milliseconds; end must exceed start by at most 300000 ms.
        response_schema:
          type: object
          description: Bounded structured output schema; no references, composition or external schema loading.
        max_output_tokens: {type: integer, minimum: 1024, maximum: 32768, default: 16384}
        media:
          type: object
          additionalProperties: false
          required: [mime_type, data, sha256]
          properties:
            mime_type:
              type: string
              enum: [video/mp4, audio/mpeg, audio/wav, image/png, image/jpeg, image/webp]
            data: {type: string, minLength: 1, maxLength: 67108864}
            sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
  - capability_id: analysis.analyze
    type: analysis
    model_id: gemini-2.5-pro
    operation: analysis.analyze
    execution_state: adapter_connected_unverified
    parameter_schema: *analysis_parameters
  - capability_id: analysis.analyze
    type: analysis
    model_id: gemini-3-flash-preview
    operation: analysis.analyze
    execution_state: enabled
    parameter_schema: *analysis_parameters
