  - capability_id: image.generate.nano_banana_2_1
    type: image
    model_id: gemini-nano-banana-2.1
    display_name: Nano Banana 2.1
    model_logo: nano-banana.png
    model_logo_mime: image/png
    operation: image.generate
    execution_state: enabled
    card_group: nano-banana-2-1
    card_title: Nano Banana 2.1
    input_summary: 提示词
    output_summary: PNG 图像 · $0.0336/张
    parameter_schema: &image_generate_parameters
      type: object
      additionalProperties: false
      required:
        - prompt
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 32000
        aspect_ratio:
          type: string
          enum:
            - "1:1"
            - "2:3"
            - "3:2"
            - "3:4"
            - "4:3"
            - "9:16"
            - "16:9"
        images:
          type: array
          maxItems: 0
  - capability_id: image.edit.nano_banana_2_1
    type: image
    model_id: gemini-nano-banana-2.1
    display_name: Nano Banana 2.1
    model_logo: nano-banana.png
    model_logo_mime: image/png
    operation: image.edit
    execution_state: enabled
    card_group: nano-banana-2-1
    card_title: Nano Banana 2.1
    input_summary: 提示词 · 1–6 张参考图（0 张蒙版）
    output_summary: PNG 图像 · $0.0336/张
    parameter_schema: &image_edit_parameters
      type: object
      additionalProperties: false
      required:
        - prompt
        - images
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 32000
        aspect_ratio:
          type: string
          enum:
            - "1:1"
            - "2:3"
            - "3:2"
            - "3:4"
            - "4:3"
            - "9:16"
            - "16:9"
        images:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required:
              - mime_type
              - data
            properties:
              mime_type:
                type: string
                enum:
                  - image/png
                  - image/jpeg
                  - image/webp
              data:
                type: string
                minLength: 1

