schema_version: 1
channel_id: google
capabilities:
  - capability_id: image.generate
    type: image
    model_id: gemini-3.1-flash-image
    operation: image.generate
    execution_state: adapter_connected_unverified
    parameter_schema:
      type: object
      additionalProperties: false
      required:
        - prompt
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 32000
        images:
          type: array
          maxItems: 0
  - capability_id: image.edit
    type: image
    model_id: gemini-3.1-flash-image
    operation: image.edit
    execution_state: adapter_connected_unverified
    parameter_schema:
      type: object
      additionalProperties: false
      required:
        - prompt
        - images
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 32000
        images:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: object
            additionalProperties: false
            required:
              - mime_type
              - data
            properties:
              mime_type:
                type: string
                enum:
                  - image/png
                  - image/jpeg
                  - image/webp
              data:
                type: string
                minLength: 1

