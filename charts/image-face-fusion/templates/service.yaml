apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.workloadName | default "image-face-fusion" }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.workloadName | default "image-face-fusion" }}
  ports:
  - name: http
    port: 8000
    targetPort: http
