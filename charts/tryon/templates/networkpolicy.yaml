apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tryon.name" . }}-studio
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "tryon.labels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.studio.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.studio.podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8000
