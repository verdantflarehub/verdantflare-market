apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-mcp-server
  namespace: {{ .Release.Namespace }}
  annotations:
    station.verdantflare.com/app-id: {{ .Values.appId | default .Chart.Name | quote }}
    {{- if .Values.station }}
    {{- if .Values.station.stationId }}
    station.verdantflare.com/station-id: {{ .Values.station.stationId | quote }}
    {{- end }}
    {{- if .Values.station.organizationId }}
    station.verdantflare.com/organization-id: {{ .Values.station.organizationId | quote }}
    {{- end }}
    {{- if .Values.station.installationId }}
    station.verdantflare.com/installation-id: {{ .Values.station.installationId | quote }}
    {{- end }}
    {{- if .Values.station.templateHash }}
    station.verdantflare.com/template-hash: {{ .Values.station.templateHash | quote }}
    {{- end }}
    {{- end }}
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/name: speech-mcp-server
    app.kubernetes.io/part-of: verdantflare-speech
    app.kubernetes.io/version: {{ .Values.appVersion | quote }}
    apps.verdantflare.com/brand: vf
    apps.verdantflare.com/group: music
    apps.verdantflare.com/managed: "true"
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: speech-mcp-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: speech-mcp-server
        app.kubernetes.io/part-of: verdantflare-speech
    spec:
      serviceAccountName: {{ (dig "serviceAccount" "speech-mcp-gpu" (.Values.gpuTask | default dict)) | quote }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: speech-mcp-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
          ports:
            - name: mcp
              containerPort: 8000
              protocol: TCP
          env:
            - name: ETCD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: etcd-client-speech
                  key: active-username
                  optional: true
            - name: ETCD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: etcd-client-speech
                  key: active-password
                  optional: true
            - name: GPU_TASK_ROLE
              value: {{ (dig "role" "indextts2" (.Values.gpuTask | default dict)) | quote }}
            - name: GPU_TASK_DEPLOYMENT
              value: {{ (dig "deployment" "speech-indextts2-api" (.Values.gpuTask | default dict)) | quote }}
            - name: GPU_IDLE_SECONDS
              value: {{ (dig "idleSeconds" "600" (.Values.gpuTask | default dict)) | quote }}
            - name: SPEECH_RUNTIME_TOKEN
              valueFrom:
                secretKeyRef:
                  name: speech-runtime
                  key: token
            - name: SPEECH_WORLD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-world-secret
                  key: WORLD_SERVICE_TOKEN
                  optional: true
          envFrom:
            - configMapRef:
                name: speech-mcp-server
            - secretRef:
                name: speech-business
          livenessProbe:
            httpGet:
              path: /health
              port: mcp
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: mcp
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 7
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: platform-ca
              mountPath: /etc/speech/platform
              readOnly: true
      volumes:
        - name: platform-ca
          configMap:
            name: speech-platform-read-ca-v1
            defaultMode: 420
            items:
              - key: ca.crt
                path: ca.crt
