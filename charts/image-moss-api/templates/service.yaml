apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.workloadName | default "image-moss-api" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: verdantflare-image
    app.kubernetes.io/name: {{ .Values.workloadName | default "image-moss-api" }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.workloadName | default "image-moss-api" }}
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP

