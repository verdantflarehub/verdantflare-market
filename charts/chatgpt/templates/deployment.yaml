apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatgpt-channel
  namespace: {{ .Release.Namespace }}
  annotations:
    station.verdantflare.com/app-id: {{ .Values.appId | default .Chart.Name | quote }}
    {{- if .Values.station }}
    {{- if .Values.station.stationId }}
    station.verdantflare.com/station-id: {{ .Values.station.stationId | quote }}
    {{- end }}
    {{- if .Values.station.organizationId }}
    station.verdantflare.com/organization-id: {{ .Values.station.organizationId | quote }}
    {{- end }}
    {{- if .Values.station.installationId }}
    station.verdantflare.com/installation-id: {{ .Values.station.installationId | quote }}
    {{- end }}
    {{- if .Values.station.templateHash }}
    station.verdantflare.com/template-hash: {{ .Values.station.templateHash | quote }}
    {{- end }}
    {{- end }}
spec:
  progressDeadlineSeconds: 600
  replicas: {{ .Values.replicas | default 1 }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: chatgpt-channel
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatgpt-channel
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: CHATGPT_STATE_DB
          value: {{ .Values.storage.stateDbPath | default "/data/chatgpt/state.sqlite3" | quote }}
        - name: CHATGPT_NETWORK_URL
          value: {{ .Values.network.url | default (printf "http://app-network.%s.svc.cluster.local:8080" .Release.Namespace) | quote }}
        - name: CHATGPT_NETWORK_TOKEN
          valueFrom:
            secretKeyRef:
              key: {{ .Values.network.tokenKey | default "token" }}
              name: {{ .Values.network.existingSecretName | default "network-channel-chatgpt-access" }}
        envFrom:
        - secretRef:
            name: chatgpt-channel-auth
        - configMapRef:
            name: chatgpt-channel-origins-v0-1-0
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: management
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 1
        name: gateway
        ports:
        - containerPort: 8000
          name: management
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: management
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: {{ .Values.storage.mountPath | default "/data/chatgpt" }}
          name: state
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: verdentflare-5090
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      terminationGracePeriodSeconds: 30
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: {{ .Values.storage.existingClaim | default "chatgpt-channel" }}
      - emptyDir: {}
        name: tmp
