apiVersion: v1
kind: Service
metadata:
  name: chatgpt-channel
  namespace: verdantflare-chatgpt
spec:
  ports:
  - name: management
    port: 8000
    protocol: TCP
    targetPort: management
  - name: execution
    port: 8001
    protocol: TCP
    targetPort: 8001
  selector:
    app.kubernetes.io/name: chatgpt-channel
  type: ClusterIP
