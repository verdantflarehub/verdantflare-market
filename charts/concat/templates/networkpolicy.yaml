apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "concat.name" . }}-deny-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "concat.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "concat.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress: []
