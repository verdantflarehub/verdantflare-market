apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-publishing-studio-only
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.workloadName | default "app-publishing-relay" }}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-station
      podSelector:
        matchLabels:
          app.kubernetes.io/name: verdantflare-studio
    ports:
    - protocol: TCP
      port: 8090
