apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.workloadName | default "app-publishing-relay" }}
  namespace: {{ .Release.Namespace }}
  annotations:
    station.verdantflare.com/app-id: {{ .Values.appId | default .Chart.Name | quote }}
    {{- with .Values.station }}
    {{- with .stationId }}
    station.verdantflare.com/station-id: {{ . | quote }}
    {{- end }}
    {{- with .organizationId }}
    station.verdantflare.com/organization-id: {{ . | quote }}
    {{- end }}
    {{- with .installationId }}
    station.verdantflare.com/installation-id: {{ . | quote }}
    {{- end }}
    {{- with .templateHash }}
    station.verdantflare.com/template-hash: {{ . | quote }}
    {{- end }}
    {{- end }}
  labels:
    app.kubernetes.io/name: {{ .Values.workloadName | default "app-publishing-relay" }}
    app.kubernetes.io/part-of: verdantflare
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.workloadName | default "app-publishing-relay" }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.workloadName | default "app-publishing-relay" }}
        app.kubernetes.io/part-of: verdantflare
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: relay
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: APP_PUBLISH_LISTEN
          value: 0.0.0.0:8090
        - name: APP_PUBLISH_CONTROL_ENDPOINT
          value: https://hub.verdantflarehub.com/api/control/internal/studio-publish/mcp
        ports:
        - name: mcp-relay
          containerPort: 8090
        readinessProbe:
          httpGet:
            path: /readyz
            port: mcp-relay
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: mcp-relay
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
