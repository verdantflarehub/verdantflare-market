{{- include "candidate.reviewGuard" . -}}
{{- if .Values.install.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "candidate.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Chart.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["gateway", "run"]
          ports:
            - name: app
              containerPort: 8642
          env:
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingName }}
                  key: API_SERVER_KEY
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD
              value: "0"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /opt/data
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "candidate.name" . }}
{{- end }}
