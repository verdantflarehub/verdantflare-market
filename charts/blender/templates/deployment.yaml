apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.workloadName | default "blender-manager" }}
  namespace: {{ .Release.Namespace }}
  annotations:
    station.verdantflare.com/app-id: {{ .Values.appId | default .Chart.Name | quote }}
    {{- if .Values.station }}
    {{- if .Values.station.stationId }}
    station.verdantflare.com/station-id: {{ .Values.station.stationId | quote }}
    {{- end }}
    {{- if .Values.station.organizationId }}
    station.verdantflare.com/organization-id: {{ .Values.station.organizationId | quote }}
    {{- end }}
    {{- if .Values.station.installationId }}
    station.verdantflare.com/installation-id: {{ .Values.station.installationId | quote }}
    {{- end }}
    {{- if .Values.station.templateHash }}
    station.verdantflare.com/template-hash: {{ .Values.station.templateHash | quote }}
    {{- end }}
    {{- end }}
spec:
  progressDeadlineSeconds: 600
  replicas: {{ .Values.replicas | default 1 }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.workloadName | default "blender-manager" }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.workloadName | default "blender-manager" }}
        app.kubernetes.io/part-of: verdantflare-app
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: BLENDER_INSTANCE_MANAGEMENT
          value: 'true'
        - name: BLENDER_INSTANCES_FILE
          value: /config/instances.json
        - name: BLENDER_DATABASE
          value: /state/blender.db
        - name: BLENDER_TURN_HOST
          value: 192.168.1.200
        - name: BLENDER_TURN_PORT
          value: '3478'
        - name: BLENDER_TURN_SECRET_FILE
          value: /turn/auth.conf
        - name: BLENDER_CONTENT_ORIGIN
          value: {{ (dig "contentOrigin" "http://studio-blender-content.verdantflare-station.svc.cluster.local:8001" (.Values.services | default dict)) | quote }}
        - name: BLENDER_CONTENT_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: blender-content
        - name: BLENDER_STUDIO_TOKEN
          valueFrom:
            secretKeyRef:
              key: BLENDER_STUDIO_TOKEN
              name: blender-internal-auth
        - name: BLENDER_WORKER_A
          valueFrom:
            secretKeyRef:
              key: BLENDER_WORKER_A
              name: blender-internal-auth
        - name: BLENDER_GUI_A_PASSWORD
          valueFrom:
            secretKeyRef:
              key: BLENDER_GUI_A_PASSWORD
              name: blender-internal-auth
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 1
        name: app
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /config
          name: config
          readOnly: true
        - mountPath: /state
          name: state
        - mountPath: /turn
          name: turn
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: blender-instances
        name: config
      - name: state
        persistentVolumeClaim:
          claimName: {{ .Values.storage.existingClaim | default "blender-app-state" }}
      - name: turn
        secret:
          defaultMode: 292
          secretName: blender-turn-auth
