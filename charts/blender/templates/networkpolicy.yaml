{{- if .Values.networkPolicy | default dict | dig "enabled" true }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blender-studio-only
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.workloadName | default "blender-manager" }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-station
      podSelector:
        matchLabels:
          app.kubernetes.io/name: verdantflare-studio
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-station
      podSelector:
        matchLabels:
          app.kubernetes.io/name: station-runtime
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-station
      podSelector:
        matchLabels:
          app.kubernetes.io/name: station-core
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blender-worker-internal-only
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: blender-worker
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ .Values.workloadName | default "blender-manager" }}
    ports:
    - protocol: TCP
      port: 48084
    - protocol: TCP
      port: 48085
    - protocol: TCP
      port: 48083
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-station
      podSelector:
        matchLabels:
          app.kubernetes.io/name: verdantflare-studio
    ports:
    - protocol: TCP
      port: 48083
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-station
      podSelector:
        matchLabels:
          app.kubernetes.io/name: station-runtime
    ports:
    - protocol: TCP
      port: 48084
    - protocol: TCP
      port: 48085
{{- end }}

