apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blender-mcp.name" . }}-studio-only
  labels:
    {{- include "blender-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: blender
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.stationNamespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.networkPolicy.studioPodName | quote }}
      ports:
        - {port: {{ .Values.service.port }}, protocol: TCP}
