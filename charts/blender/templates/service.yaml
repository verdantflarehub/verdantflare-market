apiVersion: v1
kind: Service
metadata:
  name: {{ include "blender-mcp.name" . }}
  labels:
    {{- include "blender-mcp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: blender
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
