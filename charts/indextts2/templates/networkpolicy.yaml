apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "indextts2.name" . }}-deny-ingress
  labels:
    {{- include "indextts2.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "indextts2.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress: []
