{{- if .Values.networkPolicy | default dict | dig "enabled" true }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: network-channel-consumers
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.workloadName | default "app-network" }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-station
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-video
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-chatgpt
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-google
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-grok
    ports:
    - protocol: TCP
      port: 8080
{{- end }}

