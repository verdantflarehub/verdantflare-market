apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-mcp-server
  namespace: {{ .Release.Namespace }}
  annotations:
    station.verdantflare.com/app-id: {{ .Values.appId | default .Chart.Name | quote }}
    {{- if .Values.station }}
    {{- if .Values.station.stationId }}
    station.verdantflare.com/station-id: {{ .Values.station.stationId | quote }}
    {{- end }}
    {{- if .Values.station.organizationId }}
    station.verdantflare.com/organization-id: {{ .Values.station.organizationId | quote }}
    {{- end }}
    {{- if .Values.station.installationId }}
    station.verdantflare.com/installation-id: {{ .Values.station.installationId | quote }}
    {{- end }}
    {{- if .Values.station.templateHash }}
    station.verdantflare.com/template-hash: {{ .Values.station.templateHash | quote }}
    {{- end }}
    {{- end }}
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/name: music-mcp-server
    app.kubernetes.io/part-of: verdantflare-music
    app.kubernetes.io/version: {{ .Values.appVersion | quote }}
    apps.verdantflare.com/brand: vf
    apps.verdantflare.com/group: music
    apps.verdantflare.com/managed: 'true'
spec:
  progressDeadlineSeconds: 600
  replicas: {{ .Values.replicas | default 1 }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: music-mcp-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: music-mcp-server
        app.kubernetes.io/part-of: verdantflare-music
    spec:
      {{- with (dig "serviceAccount" "" (.Values.gpuTask | default dict)) }}
      serviceAccountName: {{ . | quote }}
      automountServiceAccountToken: true
      {{- end }}
      containers:
      - env:
        - name: ETCD_USERNAME
          valueFrom:
            secretKeyRef:
              key: active-username
              name: etcd-client-music
              optional: true
        - name: ETCD_PASSWORD
          valueFrom:
            secretKeyRef:
              key: active-password
              name: etcd-client-music
              optional: true
        - name: SERVICE_VERSION
          value: {{ .Values.appVersion | quote }}
        - name: ETCD_ENDPOINTS
          value: {{ (dig "etcdEndpoints" "http://etcd.verdantflare-station.svc.cluster.local:2379" (.Values.services | default dict)) | quote }}
        - name: MCP_SERVICE_ENDPOINT
          value: {{ (dig "mcpServiceEndpoint" (printf "http://music-mcp-server.%s.svc.cluster.local:8000/mcp" .Release.Namespace) (.Values.services | default dict)) | quote }}
        - name: MCP_HEALTH_ENDPOINT
          value: {{ (dig "mcpHealthEndpoint" (printf "http://music-mcp-server.%s.svc.cluster.local:8000/health" .Release.Namespace) (.Values.services | default dict)) | quote }}
        - name: MUSIC_MCP_ALLOWED_HOSTS
          value: {{ (dig "allowedHosts" (printf "192.168.1.200:*,127.0.0.1:*,localhost:*,[::1]:*,music-mcp-server:*,music-mcp-server.%s:*,music-mcp-server.%s.svc.cluster.local:*,*.cluster.local:*" .Release.Namespace .Release.Namespace) (.Values.services | default dict)) | quote }}
        - name: MUSIC3_URL
          value: {{ (dig "music3Url" (printf "http://music-minimax-music3-api.%s.svc.cluster.local:8000" .Release.Namespace) (.Values.services | default dict)) | quote }}
        {{- with .Values.gpuTask }}
        - name: GPU_TASK_ROLE
          value: {{ .role | quote }}
        - name: GPU_TASK_DEPLOYMENT
          value: {{ .deployment | quote }}
        - name: GPU_IDLE_SECONDS
          value: {{ .idleSeconds | default "600" | quote }}
        {{- end }}
        - name: UVR5_URL
          value: {{ (dig "uvr5Url" (printf "http://music-uvr5-api.%s.svc.cluster.local:8000" .Release.Namespace) (.Values.services | default dict)) | quote }}
        - name: RVC_URL
          value: {{ (dig "rvcUrl" (printf "http://music-rvc-api.%s.svc.cluster.local:8000" .Release.Namespace) (.Values.services | default dict)) | quote }}
        - name: LYRICS_ALIGNER_URL
          value: {{ (dig "lyricsAlignerUrl" (printf "http://music-lyrics-aligner-api.%s.svc.cluster.local:8000" .Release.Namespace) (.Values.services | default dict)) | quote }}
        - name: MIXER_URL
          value: {{ (dig "mixerUrl" (printf "http://music-audio-mixer-api.%s.svc.cluster.local:8000" .Release.Namespace) (.Values.services | default dict)) | quote }}
        - name: MUSIC_EDITOR_URL
          value: {{ (dig "musicEditorUrl" (printf "http://music-ace-step-api.%s.svc.cluster.local:8001" .Release.Namespace) (.Values.services | default dict)) | quote }}
        - name: MUSIC_MCP_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              key: MUSIC_MCP_BEARER_TOKEN
              name: music-mcp-auth
        - name: MUSIC_EDITOR_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              key: MUSIC_MCP_BEARER_TOKEN
              name: music-mcp-auth
        envFrom:
        - configMapRef:
            name: music-runtime-config
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: api
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data/projects
          name: projects
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: verdentflare-5090
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: projects
        persistentVolumeClaim:
          claimName: {{ .Values.storage.existingClaim | default "music-projects" }}
