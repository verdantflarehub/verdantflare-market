apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-mcp-server
  namespace: verdantflare-music
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/name: music-mcp-server
    app.kubernetes.io/part-of: verdantflare-music
    app.kubernetes.io/version: 0.9.16
    apps.verdantflare.com/brand: vf
    apps.verdantflare.com/group: music
    apps.verdantflare.com/managed: 'true'
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: music-mcp-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: music-mcp-server
        app.kubernetes.io/part-of: verdantflare-music
    spec:
      containers:
      - env:
        - name: ETCD_USERNAME
          valueFrom:
            secretKeyRef:
              key: active-username
              name: etcd-client-music
              optional: true
        - name: ETCD_PASSWORD
          valueFrom:
            secretKeyRef:
              key: active-password
              name: etcd-client-music
              optional: true
        - name: SERVICE_VERSION
          value: 0.9.16
        - name: MUSIC_MCP_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              key: MUSIC_MCP_BEARER_TOKEN
              name: music-mcp-auth
        - name: MUSIC_EDITOR_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              key: MUSIC_MCP_BEARER_TOKEN
              name: music-mcp-auth
        envFrom:
        - configMapRef:
            name: music-runtime-config
        image: registry.cn-qingdao.aliyuncs.com/wod/verdantflare-app:music-mcp-server-v0.9.16
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: api
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data/projects
          name: projects
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: verdentflare-5090
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: projects
        persistentVolumeClaim:
          claimName: music-projects
