apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-frame-interpolation
  namespace: {{ .Release.Namespace }}
  annotations:
    station.verdantflare.com/app-id: {{ .Values.appId | default .Chart.Name | quote }}
    {{- if .Values.station }}
    {{- if .Values.station.stationId }}
    station.verdantflare.com/station-id: {{ .Values.station.stationId | quote }}
    {{- end }}
    {{- if .Values.station.organizationId }}
    station.verdantflare.com/organization-id: {{ .Values.station.organizationId | quote }}
    {{- end }}
    {{- if .Values.station.installationId }}
    station.verdantflare.com/installation-id: {{ .Values.station.installationId | quote }}
    {{- end }}
    {{- if .Values.station.templateHash }}
    station.verdantflare.com/template-hash: {{ .Values.station.templateHash | quote }}
    {{- end }}
    {{- end }}
  labels:
    app.kubernetes.io/name: video-frame-interpolation
    app.kubernetes.io/part-of: verdantflare-video
    app.kubernetes.io/version: {{ .Values.appVersion | default "0.2.6" | quote }}
    apps.verdantflare.com/brand: github
    apps.verdantflare.com/group: video
    apps.verdantflare.com/managed: 'true'
spec:
  replicas: {{ if kindIs "invalid" .Values.replicas }}1{{ else }}{{ .Values.replicas }}{{ end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: video-frame-interpolation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-frame-interpolation
        app.kubernetes.io/part-of: verdantflare-video
    spec:
      automountServiceAccountToken: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: api
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
        env:
        - name: VIDEO_MODEL_ROOT
          value: /models/bundle
        - name: VIDEO_PROCESSING_ROOT
          value: /data/interpolate
        - name: VIDEO_ARTIFACT_ROOT
          value: {{ (dig "artifactRoot" "/source/video" (.Values.runtime | default dict)) | quote }}
        - name: VIDEO_INTERPOLATION_MAX_EDGE
          value: {{ (dig "maxEdge" "3072" (.Values.runtime | default dict)) | quote }}
        - name: VIDEO_GPU_SHARING_STRATEGY
          value: {{ (dig "gpuSharingStrategy" "time-slicing" (.Values.runtime | default dict)) | quote }}
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        resources:
          requests:
            nvidia.com/gpu: '1'
          limits:
            nvidia.com/gpu: '1'
        volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
        - name: tasks
          mountPath: /data/interpolate
        - name: sources
          mountPath: /source
          readOnly: true
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 180
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: {{ .Values.storage.modelsClaim | default "video-rife-models" | quote }}
      - name: tasks
        persistentVolumeClaim:
          claimName: {{ .Values.storage.tasksClaim | default "video-rife-tasks" | quote }}
      - name: sources
        persistentVolumeClaim:
          claimName: {{ .Values.storage.projectsClaim | default "video-projects" | quote }}
