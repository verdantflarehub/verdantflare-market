apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: world-internal-consumers
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: app-world
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: app-project
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: app-viewer
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: verdantflare-station
      ports:
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8444
