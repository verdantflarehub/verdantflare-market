apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-world
  namespace: {{ .Release.Namespace }}
  annotations:
    station.verdantflare.com/app-id: {{ .Values.appId | default .Chart.Name | quote }}
    {{- with .Values.station }}
    {{- with .stationId }}
    station.verdantflare.com/station-id: {{ . | quote }}
    {{- end }}
    {{- with .organizationId }}
    station.verdantflare.com/organization-id: {{ . | quote }}
    {{- end }}
    {{- with .installationId }}
    station.verdantflare.com/installation-id: {{ . | quote }}
    {{- end }}
    {{- with .templateHash }}
    station.verdantflare.com/template-hash: {{ . | quote }}
    {{- end }}
    {{- end }}
  labels:
    app.kubernetes.io/name: app-world
    app.kubernetes.io/part-of: verdantflare
spec:
  progressDeadlineSeconds: 600
  replicas: {{ .Values.replicas | default 1 }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: app-world
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-world
        app.kubernetes.io/part-of: verdantflare
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: ARTIFACT_CA_FILE
              value: /etc/app/ca/ca.crt
            - name: ARTIFACT_URL
              value: {{ (dig "artifactUrl" "https://artifact.verdantflare-station.svc.cluster.local:8094" (.Values.services | default dict)) | quote }}
            - name: ETCD_ENDPOINTS
              value: {{ (dig "etcdEndpoints" "http://etcd.verdantflare-station.svc.cluster.local:2379" (.Values.services | default dict)) | quote }}
            - name: PROJECT_CA_FILE
              value: /etc/app/ca/ca.crt
            - name: PROJECT_SERVICE_URL
              value: {{ (dig "projectServiceUrl" "https://app-project.verdantflare-app.svc.cluster.local:8443" (.Values.services | default dict)) | quote }}
            - name: SSL_CERT_FILE
              value: /etc/app/ca/ca.crt
            - name: WORLD_DASHBOARD_DIR
              value: /app/dashboard
            - name: WORLD_LISTEN
              value: 0.0.0.0:8443
            - name: WORLD_MCP_ADVERTISE_URL
              value: {{ (dig "mcpAdvertiseUrl" "https://app-world.verdantflare-app.svc.cluster.local:8444/mcp" (.Values.services | default dict)) | quote }}
            - name: WORLD_MCP_LISTEN
              value: 0.0.0.0:8444
            - name: WORLD_TLS_CERT
              value: /etc/app/tls/tls.crt
            - name: WORLD_TLS_KEY
              value: /etc/app/tls/tls.key
            - name: WORLD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: WORLD_DATABASE_URL
                  name: app-world-secret
            - name: WORLD_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  key: WORLD_SERVICE_TOKEN
                  name: app-world-secret
            - name: WORLD_COORD_TOKEN
              valueFrom:
                secretKeyRef:
                  key: WORLD_COORD_TOKEN
                  name: app-world-secret
            - name: PROJECT_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  key: PROJECT_SERVICE_TOKEN
                  name: app-world-secret
            - name: PROJECT_COORD_TOKEN
              valueFrom:
                secretKeyRef:
                  key: PROJECT_COORD_TOKEN
                  name: app-world-secret
            - name: ARTIFACT_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  key: ARTIFACT_SERVICE_TOKEN
                  name: app-world-secret
            - name: PROJECT_COORD_FENCE
              valueFrom:
                secretKeyRef:
                  key: PROJECT_COORD_FENCE
                  name: app-world-secret
            - name: WORLD_COORD_FENCE
              valueFrom:
                secretKeyRef:
                  key: WORLD_COORD_FENCE
                  name: app-world-secret
            - name: ETCD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: etcd-client-world
                  key: active-username
                  optional: true
            - name: ETCD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: etcd-client-world
                  key: active-password
                  optional: true
            - name: WORLD_ANALYSIS_URL
              value: {{ (dig "analysisUrl" "https://google-channel.verdantflare-app.svc.cluster.local:8002" (.Values.services | default dict)) | quote }}
            - name: WORLD_ANALYSIS_CA_FILE
              value: /etc/app/ca/ca.crt
            - name: WORLD_ANALYSIS_DISPATCH_ENABLED
              value: {{ (dig "analysisDispatchEnabled" "true" (.Values.services | default dict)) | quote }}
            - name: GOOGLE_ANALYSIS_TOKEN
              valueFrom:
                secretKeyRef:
                  key: GOOGLE_ANALYSIS_TOKEN
                  name: app-world-secret
            - name: TMPDIR
              value: /dev/shm
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 15
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: business
            timeoutSeconds: 2
          name: app
          ports:
            - containerPort: 8443
              name: business
              protocol: TCP
            - containerPort: 8444
              name: mcp
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: business
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 2
          resources: {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/app/tls
              name: tls
              readOnly: true
            - mountPath: /etc/app/ca
              name: ca
              readOnly: true
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: verdentflare-5090
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tls
          secret:
            defaultMode: 420
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
            secretName: app-world-tls
        - configMap:
            defaultMode: 420
            items:
              - key: ca.crt
                path: ca.crt
            name: app-internal-ca
          name: ca
