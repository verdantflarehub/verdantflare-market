apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: viewer-internal-consumers
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: app-viewer
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: verdantflare-station
      ports:
        - protocol: TCP
          port: 8000
