{{- if (dig "enabled" true (.Values.networkPolicy | default dict)) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.workloadName | default "video-minimax-h3-regenerate-2k" }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.workloadName | default "video-minimax-h3-regenerate-2k" }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ (dig "clientName" "video-mcp-server" (.Values.networkPolicy | default dict)) }}
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
