# Review candidate. The image below is deliberately not deployable.
image:
  repository: registry.invalid/wod/comfyui
  tag: "0.1.0"
  digest: ""
  pullPolicy: Always

replicaCount: 1
service:
  port: 8188

resources:
  requests:
    cpu: "4"
    memory: 20Gi
    nvidia.com/gpu: 1
  limits:
    cpu: "8"
    memory: 32Gi
    nvidia.com/gpu: 1

storage:
  create: true
  existingClaim: ""
  size: 100Gi
  storageClassName: ""
  accessMode: ReadWriteOnce
  mountPath: /data

nodeSelector: {}
tolerations: []

probes:
  startup:
    path: /
    periodSeconds: 10
    failureThreshold: 60
  readiness:
    path: /
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    path: /
    periodSeconds: 30
    failureThreshold: 3
