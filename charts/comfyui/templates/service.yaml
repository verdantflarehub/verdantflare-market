apiVersion: v1
kind: Service
metadata:
  name: comfyui-manager
  namespace: {{ .Release.Namespace }}
  annotations:
    station.verdantflare.com/app-id: {{ .Values.appId | default .Chart.Name | quote }}
spec:
  ports:
  - name: http
    port: 8091
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/name: comfyui-manager
  type: ClusterIP
