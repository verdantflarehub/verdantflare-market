{{- if .Values.networkPolicy | default dict | dig "enabled" true }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: comfyui-manager-studio-only
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.workloadName | default "comfyui-manager" }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-station
      podSelector:
        matchLabels:
          app.kubernetes.io/name: verdantflare-studio
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-station
      podSelector:
        matchLabels:
          app.kubernetes.io/name: station-runtime
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-station
      podSelector:
        matchLabels:
          app.kubernetes.io/name: station-core
    ports:
    - protocol: TCP
      port: 8091
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-station
      podSelector:
        matchLabels:
          app.kubernetes.io/name: station-core
    ports:
    - protocol: TCP
      port: 5050
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-station
      podSelector:
        matchLabels:
          app.kubernetes.io/name: station-runtime
    ports:
    - protocol: TCP
      port: 5055
  - to:
    - podSelector:
        matchExpressions:
        - key: station.verdantflare.com/instance-id
          operator: Exists
        - key: station.verdantflare.com/start-operation-id
          operator: Exists
    ports:
    - protocol: TCP
      port: 8188
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: comfyui-managed-workers-offline
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
    - key: station.verdantflare.com/instance-id
      operator: Exists
    - key: station.verdantflare.com/start-operation-id
      operator: Exists
    - key: app.kubernetes.io/name
      operator: DoesNotExist
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ .Values.workloadName | default "comfyui-manager" }}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-station
      podSelector:
        matchLabels:
          app.kubernetes.io/name: station-runtime
    ports:
    - protocol: TCP
      port: 8188
  egress: []
{{- end }}

