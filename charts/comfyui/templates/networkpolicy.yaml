apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "comfyui.name" . }}-deny-ingress
  labels:
    {{- include "comfyui.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "comfyui.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress: []
