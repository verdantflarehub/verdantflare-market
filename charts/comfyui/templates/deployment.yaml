apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui-manager
  namespace: {{ .Release.Namespace }}
  annotations:
    station.verdantflare.com/app-id: {{ .Values.appId | default .Chart.Name | quote }}
    {{- if .Values.station }}
    {{- if .Values.station.stationId }}
    station.verdantflare.com/station-id: {{ .Values.station.stationId | quote }}
    {{- end }}
    {{- if .Values.station.organizationId }}
    station.verdantflare.com/organization-id: {{ .Values.station.organizationId | quote }}
    {{- end }}
    {{- if .Values.station.installationId }}
    station.verdantflare.com/installation-id: {{ .Values.station.installationId | quote }}
    {{- end }}
    {{- if .Values.station.templateHash }}
    station.verdantflare.com/template-hash: {{ .Values.station.templateHash | quote }}
    {{- end }}
    {{- end }}
  labels:
    app.kubernetes.io/name: comfyui-manager
    app.kubernetes.io/part-of: verdantflare-app
spec:
  progressDeadlineSeconds: 600
  replicas: {{ .Values.replicas | default 1 }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: comfyui-manager
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: comfyui-manager
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: COMFYUI_APP_TOKEN
          valueFrom:
            secretKeyRef:
              key: app-token
              name: comfyui-dashboard-access
        - name: COMFYUI_INSTALLATION_TOKEN
          valueFrom:
            secretKeyRef:
              key: core-token
              name: comfyui-dashboard-access
        - name: COMFYUI_RUNTIME_TOKEN
          valueFrom:
            secretKeyRef:
              key: runtime-token
              name: comfyui-dashboard-access
        - name: COMFYUI_MAINTENANCE_TOKEN
          valueFrom:
            secretKeyRef:
              key: maintenance-token
              name: comfyui-dashboard-access
        - name: COMFYUI_INSTALLATION_ID
          value: {{ .Values.station.installationId | quote }}
        - name: COMFYUI_STATION_ID
          value: {{ .Values.station.stationId | quote }}
        - name: COMFYUI_ORGANIZATION_ID
          value: {{ .Values.station.organizationId | quote }}
        - name: COMFYUI_APP_VERSION
          value: {{ .Values.appVersion | quote }}
        - name: COMFYUI_ENABLE_GPU_PROFILES
          value: {{ ternary "1" "0" (default false .Values.enableGpuProfiles) | quote }}
        - name: COMFYUI_PROJECT_TOKEN
          valueFrom:
            secretKeyRef:
              key: PROJECT_SERVICE_TOKEN
              name: {{ (dig "projectSecretName" "app-project-secret" (.Values.services | default dict)) | quote }}
              optional: true
        - name: COMFYUI_AUTHORITY_TOKEN
          valueFrom:
            secretKeyRef:
              key: PROJECT_AUTHORITY_TOKEN
              name: {{ (dig "projectSecretName" "app-project-secret" (.Values.services | default dict)) | quote }}
              optional: true
        - name: COMFYUI_PROJECT_OPEN_WRITE_ONLY
          value: {{ ternary "1" "0" (default true (dig "projectOpenWriteOnly" true (.Values.services | default dict))) | quote }}
        - name: COMFYUI_PROJECT_CA_PEM
          valueFrom:
            configMapKeyRef:
              key: ca.crt
              name: {{ (dig "projectCaConfigMap" "image-project-ca-v1" (.Values.services | default dict)) | quote }}
              optional: true
        {{- if (dig "artifactOrigin" "" (.Values.services | default dict)) }}
        - name: COMFYUI_ARTIFACT_ORIGIN
          value: {{ .Values.services.artifactOrigin | quote }}
        {{- end }}
        - name: COMFYUI_ARTIFACT_TOKEN
          valueFrom:
            secretKeyRef:
              key: {{ (dig "artifactSecretKey" "" (.Values.services | default dict)) | default "artifact-token" | quote }}
              name: {{ (dig "artifactSecretName" "" (.Values.services | default dict)) | default (dig "secretName" "comfyui-dashboard-access" (.Values.services | default dict)) | quote }}
              optional: true
        - name: COMFYUI_ARTIFACT_CA_PEM
          valueFrom:
            configMapKeyRef:
              key: ca.crt
              name: {{ (dig "projectCaConfigMap" "image-project-ca-v1" (.Values.services | default dict)) | quote }}
              optional: true
        {{- if (dig "workerImageDigest" "" (.Values.services | default dict)) }}
        - name: COMFYUI_WORKER_IMAGE_DIGEST
          value: {{ .Values.services.workerImageDigest | quote }}
        {{- end }}
        {{- if (dig "headlessWorkspaceDir" "" (.Values.services | default dict)) }}
        - name: COMFYUI_HEADLESS_WORKSPACE_DIR
          value: {{ .Values.services.headlessWorkspaceDir | quote }}
        {{- end }}
        {{- if (dig "headlessWorkerOrigin" "" (.Values.services | default dict)) }}
        - name: COMFYUI_HEADLESS_WORKER_ORIGIN
          value: {{ .Values.services.headlessWorkerOrigin | quote }}
        {{- end }}
        {{- if (dig "headlessWorkerId" "" (.Values.services | default dict)) }}
        - name: COMFYUI_HEADLESS_WORKER_ID
          value: {{ .Values.services.headlessWorkerId | quote }}
        {{- end }}
        - name: COMFYUI_HEADLESS_WORKER_TOKEN
          valueFrom:
            secretKeyRef:
              key: {{ (dig "headlessWorkerSecretKey" "" (.Values.services | default dict)) | default "headless-worker-token" | quote }}
              name: {{ (dig "headlessWorkerSecretName" "" (.Values.services | default dict)) | default (dig "secretName" "comfyui-dashboard-access" (.Values.services | default dict)) | quote }}
              optional: true
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
        livenessProbe:
          failureThreshold: 3
          periodSeconds: 15
          successThreshold: 1
          tcpSocket:
            port: http
          timeoutSeconds: 1
        name: app
        ports:
        - containerPort: 8091
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 5
          successThreshold: 1
          tcpSocket:
            port: http
          timeoutSeconds: 1
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 24
          periodSeconds: 5
          successThreshold: 1
          tcpSocket:
            port: http
          timeoutSeconds: 1
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /config
          name: config
          readOnly: true
        - mountPath: /data
          name: state
        - mountPath: /tmp
          name: temp
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: verdentflare-5090
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          items:
          - key: app.json
            path: app.json
          name: comfyui-manager-config
        name: config
      - name: state
        persistentVolumeClaim:
          claimName: {{ .Values.storage.existingClaim | default "comfyui-app-state" }}
      - emptyDir:
          sizeLimit: 128Mi
        name: temp
