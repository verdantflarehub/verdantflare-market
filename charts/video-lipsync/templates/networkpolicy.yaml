{{- if (.Values.networkPolicy).enabled | default true }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: video-lipsync-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: video-lipsync
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ (.Values.networkPolicy).clientName | default "video-mcp-server" }}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-station
    ports:
    - protocol: TCP
      port: 8000
{{- end }}
