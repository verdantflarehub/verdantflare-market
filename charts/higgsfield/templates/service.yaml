apiVersion: v1
kind: Service
metadata:
  name: video-higgsfield-gateway
  namespace: {{ .Release.Namespace }}
  annotations:
    station.verdantflare.com/app-id: {{ .Values.appId | default .Chart.Name | quote }}
spec:
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: http
  - name: management
    port: 8001
    protocol: TCP
    targetPort: management
  selector:
    app.kubernetes.io/name: video-higgsfield-gateway
  type: ClusterIP
