apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.workloadName | default "higgsfield-channel" }}
  namespace: {{ .Release.Namespace }}
  annotations:
    station.verdantflare.com/app-id: {{ .Values.appId | default .Chart.Name | quote }}
    {{- if .Values.station }}
    {{- if .Values.station.stationId }}
    station.verdantflare.com/station-id: {{ .Values.station.stationId | quote }}
    {{- end }}
    {{- if .Values.station.organizationId }}
    station.verdantflare.com/organization-id: {{ .Values.station.organizationId | quote }}
    {{- end }}
    {{- if .Values.station.installationId }}
    station.verdantflare.com/installation-id: {{ .Values.station.installationId | quote }}
    {{- end }}
    {{- if .Values.station.templateHash }}
    station.verdantflare.com/template-hash: {{ .Values.station.templateHash | quote }}
    {{- end }}
    {{- end }}
spec:
  progressDeadlineSeconds: 600
  replicas: {{ .Values.replicas | default 1 }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.workloadName | default "higgsfield-channel" }}
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        checksum/channel-metadata: {{ .Files.Get "channel.yaml" | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ .Values.workloadName | default "higgsfield-channel" }}
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: CHANNEL_METADATA_FILE
          value: /etc/verdantflare/channel.yaml
        - name: CHANNEL_EXECUTION_URL
          value: {{ .Values.channelDiscovery.executionUrl | quote }}
        envFrom:
        - configMapRef:
            name: video-higgsfield-gateway
        - secretRef:
            name: video-higgsfield-binding
        - secretRef:
            name: higgsfield-management-access
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 1
        name: gateway
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        - containerPort: 8001
          name: management
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: {{ .Values.storage.mountPath | default "/data/higgsfield" }}
          name: state
        - mountPath: /etc/verdantflare/channel.yaml
          name: channel-metadata
          readOnly: true
          subPath: channel.yaml
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: verdentflare-5090
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      terminationGracePeriodSeconds: 30
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: {{ .Values.storage.existingClaim | default "video-higgsfield" }}
      - configMap:
          name: {{ .Values.workloadName | default "higgsfield-channel" }}-metadata
        name: channel-metadata
      - emptyDir: {}
        name: tmp
