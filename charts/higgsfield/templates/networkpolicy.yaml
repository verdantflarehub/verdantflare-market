{{- if .Values.networkPolicy | default dict | dig "enabled" true }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: higgsfield-gateway-access
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.workloadName | default "higgsfield-channel" }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-station
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-video
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 8001
{{- end }}

