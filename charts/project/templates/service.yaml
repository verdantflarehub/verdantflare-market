apiVersion: v1
kind: Service
metadata:
  name: app-project
  namespace: {{ .Release.Namespace }}
  annotations:
    station.verdantflare.com/app-id: {{ .Values.appId | default .Chart.Name | quote }}
  labels:
    app.kubernetes.io/name: app-project
    app.kubernetes.io/part-of: verdantflare
spec:
  ports:
  - name: business
    port: 8443
    protocol: TCP
    targetPort: business
  - name: mcp
    port: 8444
    protocol: TCP
    targetPort: mcp
  - name: peer-read
    port: 8096
    protocol: TCP
    targetPort: peer-read
  selector:
    app.kubernetes.io/name: app-project
  type: ClusterIP
