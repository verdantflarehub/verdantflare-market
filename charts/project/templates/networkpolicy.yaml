{{- if .Values.networkPolicy | default dict | dig "enabled" true }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: project-internal-consumers
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.workloadName | default "app-project" }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-station
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-image
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-video
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-music
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-speech
    ports:
    - protocol: TCP
      port: 8443
    - protocol: TCP
      port: 8444
    - protocol: TCP
      port: 8096
{{- end }}

