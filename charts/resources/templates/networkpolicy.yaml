{{- if .Values.networkPolicy | default dict | dig "enabled" true }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: resources-platform-only
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.workloadName | default "app-resources" }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: verdantflare-station
    ports:
    - protocol: TCP
      port: 8000
{{- end }}

